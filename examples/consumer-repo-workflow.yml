# Example: wire the boilerplate's reusable workflow into a consumer repo.
#
# Copy this file to your consumer repo at:
#   .github/workflows/agent.yml
#
# Then customize the inputs for your project. The workflow will trigger
# on any issue labeled `agent:ready` that lives on the project board.

name: AI agent

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  on-card:
    uses: YOUR-ORG/ai-agent-boilerplate/.github/workflows/agent-on-card.yml@v0.1
    with:
      agent: mavis                         # claude | copilot | mavis | custom
      project_title: 'Engineering Backlog' # The name of your Project v2 board
      # project_owner: 'YOUR-ORG'          # Defaults to the repo owner
      # status_field_name: 'Status'        # The single-select Status field on the project
      # in_progress_status: 'In Progress'  # Where the card moves when the agent picks it up
      # in_review_status: 'In Review'      # Where the card moves after the PR is opened
      # agent_trigger_label: 'agent:ready' # The label that hands the card off to the agent
      # base_ref: 'main'
      # timeout_minutes: 20
      # agent_extra_args: '--model mavis-3'
    secrets:
      agent_gh_token: ${{ secrets.AGENT_GH_TOKEN }}
      # agent_api_key: ${{ secrets.MAVIS_API_KEY }}
      # default_github_token: ${{ secrets.GITHUB_TOKEN }}   # Optional fallback
      # (Named `default_github_token` because `github_token` is reserved
      # by GitHub Actions and can't be declared in workflow_call secrets.)

  on-mention:
    uses: YOUR-ORG/ai-agent-boilerplate/.github/workflows/agent-discussion.yml@v0.1
    if: ${{ false }}  # Set to `true` once you've set up the @agent-bot[bot] user
    with:
      agent: mavis
      project_title: 'Engineering Backlog'
      bot_mention: '@agent-bot'
    secrets:
      agent_gh_token: ${{ secrets.AGENT_GH_TOKEN }}

  triage:
    uses: YOUR-ORG/ai-agent-boilerplate/.github/workflows/agent-scheduled-triage.yml@v0.1
    with:
      project_title: 'Engineering Backlog'
      cron_schedule: '0 6 * * 1-5'
      # The "unready" columns the triage bot scans for cards without
      # the `agent:ready` label. Defaults match the 5-state model
      # (Backlog + Ready) and keep the legacy 4-state Todo column
      # in scope. Set any of these to '' to drop that column.
      # backlog_status: 'Backlog'
      # ready_status: 'Ready'
      # todo_status: 'Todo'
    secrets:
      agent_gh_token: ${{ secrets.AGENT_GH_TOKEN }}

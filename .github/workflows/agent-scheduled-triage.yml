name: 'Agent — scheduled Kanban triage (reusable)'

# Reusable workflow. Trigger contract:
#   - Runs on a cron schedule (default: 06:00 UTC weekdays).
#
# What it does:
#   1. Lists cards in any of the unready columns of the project. By
#      default this is `Backlog` + `Ready` (the 5-state model matching
#      GitHub's default board), but `todo_status` is also recognized for
#      4-state consumers and any of the three can be overridden.
#   2. For each card without a `agent:ready` label, posts a comment
#      asking the maintainer to add the label if the card is ready for
#      the agent. The comment names the card's current column.
#   3. Optionally, for each card with `agent:ready`, re-runs the
#      `agent-on-card` workflow (if the consumer repo opted in).
#
# Use this to keep the Kanban honest and to surface stuck cards.

on:
  workflow_call:
    inputs:
      project_title:
        type: string
        required: true
      project_owner:
        type: string
        required: false
        default: ''
      status_field_name:
        type: string
        required: false
        default: 'Status'
      todo_status:
        description: 'Status name for the legacy 4-state "Todo" column. Watched in addition to backlog/ready. Set to empty to disable.'
        type: string
        required: false
        default: 'Todo'
      backlog_status:
        description: 'Status name for the 5-state "Backlog" column (cards awaiting triage). Set to empty to disable.'
        type: string
        required: false
        default: 'Backlog'
      ready_status:
        description: 'Status name for the 5-state "Ready" column (triaged, awaiting pickup). Set to empty to disable.'
        type: string
        required: false
        default: 'Ready'
      in_progress_status:
        type: string
        required: false
        default: 'In Progress'
      in_review_status:
        type: string
        required: false
        default: 'In Review'
      done_status:
        type: string
        required: false
        default: 'Done'
      max_cards_per_run:
        description: 'Cap the number of cards touched in a single run.'
        type: number
        required: false
        default: 25
      cron_schedule:
        description: 'Cron expression. Default: weekdays 06:00 UTC.'
        type: string
        required: false
        default: '0 6 * * 1-5'
    secrets:
      agent_gh_token:
        required: true
      default_github_token:
        description: >-
          Default GITHUB_TOKEN fallback. Optional — only used if
          agent_gh_token is not provided. (Named `default_github_token`
          because `github_token` is reserved by GitHub Actions and cannot
          be declared in workflow_call secrets.)
        required: false

  schedule:
    # NOTE: hardcoded for `act`/schema compatibility. The `cron_schedule` input
    # is honored by consumers that wrap this reusable workflow with their own
    # `on: schedule:` block.
    - cron: '0 6 * * 1-5'

  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: agent-scheduled-triage
  cancel-in-progress: true

jobs:
  triage:
    name: Triage Kanban
    runs-on: ubuntu-latest
    steps:
      - name: Check out boilerplate (for the CLI)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          path: ./.boilerplate-src

      - name: Copy boilerplate
        run: |
          set -euo pipefail
          # The kanban-cli install step (below) needs the root package.json
          # and package-lock.json to run `npm ci`. Without them, npm ci
          # fails with EUSAGE ("can only install with an existing
          # package-lock.json"). The kanban-cli tsconfig.json also
          # extends ../../tsconfig.base.json, so that has to come along
          # too — otherwise `tsc` errors with TS5083.
          cp -R ./.boilerplate-src/packages ./
          [[ ! -f ./package.json     ]] && cp ./.boilerplate-src/package.json ./
          [[ ! -f ./package-lock.json ]] && cp ./.boilerplate-src/package-lock.json ./
          [[ ! -f ./tsconfig.base.json ]] && cp ./.boilerplate-src/tsconfig.base.json ./
          rm -rf ./.boilerplate-src

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build kanban CLI
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build --workspace=@boilerplate/kanban-cli

      - name: List unready cards
        id: list
        shell: bash
        env:
          PROJECT_TITLE: ${{ inputs.project_title }}
          PROJECT_OWNER: ${{ inputs.project_owner }}
          STATUS_FIELD_NAME: ${{ inputs.status_field_name }}
          TODO_STATUS: ${{ inputs.todo_status }}
          BACKLOG_STATUS: ${{ inputs.backlog_status }}
          READY_STATUS: ${{ inputs.ready_status }}
          GH_TOKEN: ${{ secrets.agent_gh_token || secrets.default_github_token }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          MAX: ${{ inputs.max_cards_per_run }}
        run: |
          set -euo pipefail
          owner="${PROJECT_OWNER:-${GITHUB_REPOSITORY_OWNER}}"

          # Build the list of unready statuses to scan, preserving order
          # and deduping. An empty value disables that slot.
          uniq_statuses=()
          for s in "${TODO_STATUS}" "${BACKLOG_STATUS}" "${READY_STATUS}"; do
            [[ -z "${s}" ]] && continue
            skip=0
            for u in "${uniq_statuses[@]:-}"; do
              if [[ "${u}" == "${s}" ]]; then skip=1; break; fi
            done
            [[ ${skip} -eq 0 ]] && uniq_statuses+=("${s}")
          done

          if [[ ${#uniq_statuses[@]} -eq 0 ]]; then
            echo "::warning::No unready statuses configured; nothing to do."
            echo "[]" > /tmp/ready.json
            echo "count=0" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # Fetch each status in turn, tag each card with its source
          # status, and merge into a single deduped JSON array.
          merged='[]'
          for s in "${uniq_statuses[@]}"; do
            echo "Scanning status '${s}'..."
            output="$(node packages/kanban-cli/dist/index.js ready \
              --project "${PROJECT_TITLE}" \
              --owner "${owner}" \
              --field "${STATUS_FIELD_NAME}" \
              --status "${s}" \
              --limit "${MAX}" \
              --format json || echo '[]')"
            tagged="$(echo "${output}" | jq --arg s "${s}" '[.[] | . + {status: $s}]')"
            merged="$(jq -s '.[0] + .[1] | unique_by(.issue_number)' \
              <(echo "${merged}") <(echo "${tagged}"))"
          done

          echo "${merged}" > /tmp/ready.json
          count="$(jq 'length' /tmp/ready.json)"
          echo "count=${count}" >> "${GITHUB_OUTPUT}"
          echo "Found ${count} unready card(s) across: ${uniq_statuses[*]}."

      - name: Nudge unready cards
        if: steps.list.outputs.count > 0
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.agent_gh_token || secrets.default_github_token }}
        run: |
          set -euo pipefail
          jq -c '.[]' /tmp/ready.json | while read -r card; do
            n="$(echo "${card}" | jq -r '.issue_number')"
            labels="$(echo "${card}" | jq -r '.labels | join(",")')"
            status="$(echo "${card}" | jq -r '.status // "Todo"')"
            if [[ "${labels}" != *"agent:ready"* ]]; then
              gh issue comment "${n}" --body "👋 Triage bot: this card has been in '${status}' for a while. Add the \`agent:ready\` label to hand it off to the AI agent, or update the status manually if it's blocked."
            fi
          done

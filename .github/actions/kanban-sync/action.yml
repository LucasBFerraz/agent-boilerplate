name: 'Kanban — sync card'
description: >-
  Move a GitHub Project v2 card to a target status, and optionally post a
  comment. Idempotent: if the card is already at the target status, no-op.

inputs:
  issue_number:
    description: 'Issue number whose card should be moved.'
    required: true
  project_title:
    description: 'Title of the Project v2 board.'
    required: true
  project_owner:
    description: 'Login of the project owner (user or org). Defaults to repo owner.'
    required: false
    default: ''
  target_status:
    description: >-
      Target status option name (e.g. "In Progress", "In Review", "Done").
    required: true
  token:
    description: >-
      Token with `project` scope. `GITHUB_TOKEN` does NOT have Projects v2
      access by default.
    required: true
  status_field_name:
    description: 'Name of the single-select Status field on the project.'
    required: false
    default: 'Status'
  comment:
    description: >-
      Optional comment body to post on the issue/card after the move. Use
      markdown; will be passed through the CLI as-is.
    required: false
    default: ''
  comment_once:
    description: >-
      If "true", only post the comment if the card was actually moved (i.e.
      status changed). Default: "false".
    required: false
    default: 'false'

outputs:
  moved:
    description: '"true" if the card was moved, "false" if already at target.'
    value: ${{ steps.sync.outputs.moved }}
  new_status_name:
    description: 'The status name after the move (echoes target_status).'
    value: ${{ steps.sync.outputs.new_status_name }}
  new_status_option_id:
    description: 'The option id of the new status.'
    value: ${{ steps.sync.outputs.new_status_option_id }}

runs:
  using: 'composite'
  steps:
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install kanban CLI
      shell: bash
      run: |
        set -euo pipefail
        if [[ -d "packages/kanban-cli" ]]; then
          npm ci --no-audit --no-fund
          npm run build --workspace=@boilerplate/kanban-cli
        else
          echo "::error::packages/kanban-cli not found in this repo." >&2
          exit 1
        fi

    - name: Sync card
      id: sync
      shell: bash
      env:
        ISSUE_NUMBER: ${{ inputs.issue_number }}
        PROJECT_TITLE: ${{ inputs.project_title }}
        PROJECT_OWNER: ${{ inputs.project_owner }}
        TARGET_STATUS: ${{ inputs.target_status }}
        STATUS_FIELD_NAME: ${{ inputs.status_field_name }}
        GH_TOKEN: ${{ inputs.token }}
        COMMENT: ${{ inputs.comment }}
        COMMENT_ONCE: ${{ inputs.comment_once }}
        GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
      run: |
        set -euo pipefail
        owner="${PROJECT_OWNER:-${GITHUB_REPOSITORY_OWNER}}"

        args=(move \
          --issue "${ISSUE_NUMBER}" \
          --project "${PROJECT_TITLE}" \
          --owner "${owner}" \
          --field "${STATUS_FIELD_NAME}" \
          --to "${TARGET_STATUS}")

        if [[ -n "${COMMENT}" ]]; then
          args+=(--comment "${COMMENT}")
          if [[ "${COMMENT_ONCE}" == "true" ]]; then args+=(--comment-only-if-moved); fi
        fi

        output="$(node packages/kanban-cli/dist/index.js "${args[@]}")"
        echo "${output}"

        moved="$(printf '%s' "${output}" | sed -n 's/^moved=\(.*\)$/\1/p' | tail -n1)"
        new_name="$(printf '%s' "${output}" | sed -n 's/^new_status_name=\(.*\)$/\1/p' | tail -n1)"
        new_id="$(printf '%s' "${output}" | sed -n 's/^new_status_option_id=\(.*\)$/\1/p' | tail -n1)"

        echo "moved=${moved:-false}" >> "${GITHUB_OUTPUT}"
        echo "new_status_name=${new_name:-${TARGET_STATUS}}" >> "${GITHUB_OUTPUT}"
        echo "new_status_option_id=${new_id:-}" >> "${GITHUB_OUTPUT}"

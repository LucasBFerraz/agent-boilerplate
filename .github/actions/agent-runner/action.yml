name: 'Agent runner (pluggable)'
description: >-
  Run an AI coding agent against the current branch in a non-interactive
  mode. The agent must respect AGENTS.md and the contract documented in
  the README of this action. The agent is expected to commit + push the
  current branch and print a single JSON line with its result.

inputs:
  agent:
    description: >-
      Which agent runtime to invoke. One of: claude, copilot, mavis,
      custom. For "custom", you must also set `setup_action`.
    required: true
    default: 'mavis'
  prompt:
    description: >-
      Prompt to send to the agent. If empty, the agent will read
      `prompt_file`. The boilerplate's reusable workflows inject the
      synthesized prompt from the issue + card.
    required: false
    default: ''
  prompt_file:
    description: >-
      Path to a file containing the prompt. Used when `prompt` is empty.
    required: false
    default: ''
  setup_action:
    description: >-
      Path to a custom setup action (for `agent: custom`). Ignored
      otherwise.
    required: false
    default: ''
  agent_cli:
    description: >-
      Override the CLI binary name (default: derived from `agent`).
    required: false
    default: ''
  extra_args:
    description: >-
      Extra args passed verbatim to the agent CLI. Use this to pass
      model names, temperature, etc.
    required: false
    default: ''
  timeout_minutes:
    description: 'Hard timeout for the agent invocation.'
    required: false
    default: '20'
  working_directory:
    description: >-
      Run the agent from this directory. Default: GITHUB_WORKSPACE.
    required: false
    default: ''
  agent_token:
    description: >-
      Token the agent should use for git push. Default: GITHUB_TOKEN.
    required: false
    default: ''
  api_key:
    description: >-
      API key for the agent runtime (e.g. MAVIS_API_KEY, ANTHROPIC_API_KEY).
      Optional for some runtimes.
    required: false
    default: ''
  result_file:
    description: >-
      File the agent should write its final JSON result to. Default:
      GITHUB_WORKSPACE/agent-result.json.
    required: false
    default: ''
  base_ref:
    description: >-
      Base ref the agent branched from. Used by the opencode recovery
      path to compute files_changed via
      `git diff origin/${base_ref}...HEAD` and to scope the
      summary to commits added on top of the base. Default: main.
    required: false
    default: 'main'

outputs:
  pr_url:
    description: 'PR URL the agent opened (from its JSON result).'
    value: ${{ steps.run.outputs.pr_url }}
  summary:
    description: 'Short summary the agent returned.'
    value: ${{ steps.run.outputs.summary }}
  files_changed:
    description: 'Comma-separated list of files the agent changed.'
    value: ${{ steps.run.outputs.files_changed }}
  result_json:
    description: 'The full JSON result the agent printed.'
    value: ${{ steps.run.outputs.result_json }}

runs:
  using: 'composite'
  steps:
    # Composite actions cannot use `inputs.*` inside `uses:` expressions
    # (the runner treats `uses:` as a near-literal string at parse time).
    # We hardcode one `run:` step per supported agent and gate each on `if:`.
    - name: Install Claude CLI
      if: inputs.agent == 'claude'
      shell: bash
      run: |
        set -euo pipefail
        # Thin wrapper: claude is published on npm. See ./setup-agent-claude
        # for the original action; the logic is duplicated here so this
        # composite action doesn't need a dynamic `uses:`.
        npm install -g @anthropic-ai/claude-code || true
        claude --version || true

    - name: Install Copilot CLI
      if: inputs.agent == 'copilot'
      shell: bash
      run: |
        set -euo pipefail
        npm install -g @githubnext/github-copilot-cli || true
        copilot --version || true

    - name: Install Mavis CLI
      if: inputs.agent == 'mavis'
      shell: bash
      env:
        MAVIS_API_KEY: ${{ inputs.api_key }}
      run: |
        set -euo pipefail
        # The MiniMax Code (Mavis) CLI is published on npm as `mmx-cli`
        # and installs an `mmx` binary. We install into RUNNER_TEMP and
        # add it to PATH so the next step can find it without needing
        # to know the global npm prefix on each runner image.
        # See https://github.com/MiniMax-AI/cli and the official install
        # guide at https://agent.minimax.io/docs/cli/quick-start.
        npm install --prefix "${RUNNER_TEMP}/mavis-cli" mmx-cli || true
        export PATH="${RUNNER_TEMP}/mavis-cli/node_modules/.bin:${PATH}"
        mmx --version || true

    - name: Install OpenCode CLI
      if: inputs.agent == 'opencode'
      shell: bash
      env:
        # OpenCode picks up LLM provider credentials from these env
        # vars (or ~/.config/opencode/config.json). At least one is
        # required for non-trivial work; the user can also rely on
        # the `opencode auth login` flow outside of CI.
        ANTHROPIC_API_KEY: ${{ inputs.api_key }}
        OPENAI_API_KEY: ${{ inputs.api_key }}
        OPENROUTER_API_KEY: ${{ inputs.api_key }}
      run: |
        set -euo pipefail
        # OpenCode (https://opencode.ai) is an open source AI coding
        # agent. The npm package is `opencode-ai` and the binary is
        # `opencode`. We install into RUNNER_TEMP and add it to PATH
        # so the next step can find it without knowing the global
        # npm prefix on each runner image.
        npm install --prefix "${RUNNER_TEMP}/opencode-cli" opencode-ai || true
        export PATH="${RUNNER_TEMP}/opencode-cli/node_modules/.bin:${PATH}"
        opencode --version || true

    - name: Prepare prompt + working directory
      id: prep
      shell: bash
      env:
        PROMPT: ${{ inputs.prompt }}
        PROMPT_FILE: ${{ inputs.prompt_file }}
        WORKDIR: ${{ inputs.working_directory }}
        RESULT_FILE: ${{ inputs.result_file }}
        AGENT_TOKEN: ${{ inputs.agent_token }}
      run: |
        set -euo pipefail
        workdir="${WORKDIR:-${GITHUB_WORKSPACE}}"
        cd "${workdir}"

        # We always write the prompt and result files to RUNNER_TEMP
        # rather than the workdir. RUNNER_TEMP is a stable per-job temp
        # directory that survives across composite action steps; using
        # it avoids path/working-dir drift between the prep and run
        # steps when the run step also re-chdirs into `workdir`.
        prompt_path="${RUNNER_TEMP}/agent-prompt.md"
        result_path="${RUNNER_TEMP}/agent-result.json"

        # Pick the prompt source
        if [[ -n "${PROMPT}" ]]; then
          printf '%s' "${PROMPT}" > "${prompt_path}"
        elif [[ -n "${PROMPT_FILE}" && -f "${PROMPT_FILE}" ]]; then
          cp "${PROMPT_FILE}" "${prompt_path}"
        else
          echo "::error::agent-runner: neither prompt nor prompt_file provided" >&2
          exit 1
        fi

        echo "result_file=${result_path}" >> "${GITHUB_OUTPUT}"
        echo "prompt_file=${prompt_path}" >> "${GITHUB_OUTPUT}"

    - name: Run agent
      id: run
      shell: bash
      env:
        AGENT: ${{ inputs.agent }}
        AGENT_CLI: ${{ inputs.agent_cli }}
        # PROMPT_FILE / RESULT_FILE are read from step outputs (the
        # prep step writes to RUNNER_TEMP/agent-prompt.md and exports
        # both paths via GITHUB_OUTPUT). Reading the paths from the
        # step outputs — rather than recomputing them — is the only
        # way to guarantee both steps see the same absolute path.
        PROMPT_FILE: ${{ steps.prep.outputs.prompt_file }}
        RESULT_FILE: ${{ steps.prep.outputs.result_file }}
        EXTRA_ARGS: ${{ inputs.extra_args }}
        WORKDIR: ${{ inputs.working_directory }}
        AGENT_TOKEN: ${{ inputs.agent_token }}
        GH_TOKEN: ${{ inputs.agent_token }}
        GH_REPO: ${{ github.repository }}
        # Used by the opencode recovery path to compute files_changed
        # and to scope the summary to commits added on top of the base.
        BASE_REF: ${{ inputs.base_ref }}
        # NOTE: we deliberately do NOT set `PATH` here. The `PATH`
        # env var is protected by GitHub Actions — assigning to it in
        # step env: clobbers the inherited PATH (the `${PATH}`
        # interpolation evaluates to empty), so system utilities like
        # `cat` become unavailable. The agent binaries are resolved
        # by absolute path inside the case branches below.
      run: |
        set -euo pipefail
        workdir="${WORKDIR:-${GITHUB_WORKSPACE}}"
        cd "${workdir}"

        cli="${AGENT_CLI:-${AGENT}}"
        case "${AGENT}" in
          claude)
            # Claude Code: non-interactive, pipe prompt on stdin.
            set +e
            "${cli}" --print --dangerously-skip-permissions \
              --output-format json \
              < "${PROMPT_FILE}" \
              > "${RESULT_FILE}.log" 2>&1
            rc=$?
            set -e
            if [[ $rc -ne 0 ]]; then
              echo "::error::claude exited with ${rc}. Log:" >&2
              cat "${RESULT_FILE}.log" >&2
              exit $rc
            fi
            # Claude Code emits its own JSON; we wrap it into our contract.
            jq '{pr_url: .pr_url // "", summary: .summary // .result // "", files_changed: (.files_changed // [])}' \
              "${RESULT_FILE}.log" > "${RESULT_FILE}"
            ;;
          copilot)
            # GitHub Copilot CLI: pass prompt as the request.
            set +e
            "${cli}" suggest -t code --target "${workdir}" \
              < "${PROMPT_FILE}" \
              > "${RESULT_FILE}.log" 2>&1
            rc=$?
            set -e
            if [[ $rc -ne 0 ]]; then
              echo "::error::copilot exited with ${rc}. Log:" >&2
              cat "${RESULT_FILE}.log" >&2
              exit $rc
            fi
            jq -n --arg summary "$(cat "${RESULT_FILE}.log")" \
              '{pr_url: "", summary: $summary, files_changed: []}' > "${RESULT_FILE}"
            ;;
          opencode)
            # OpenCode (https://opencode.ai) is an open source AI
            # coding agent. We invoke it in non-interactive mode
            # (`opencode run <prompt>`) and rely on the agent itself
            # to edit files, commit, and report back via a final
            # assistant message. The Install OpenCode CLI step above
            # installs the binary into ${RUNNER_TEMP}/opencode-cli,
            # so we resolve its absolute path here (env: PATH overrides
            # don't reliably propagate to bash scripts in some runner
            # configurations).
            if [[ -n "${AGENT_CLI:-}" ]]; then
              cli="${AGENT_CLI}"
            elif [[ -x "${RUNNER_TEMP}/opencode-cli/node_modules/.bin/opencode" ]]; then
              cli="${RUNNER_TEMP}/opencode-cli/node_modules/.bin/opencode"
            else
              cli="opencode"
            fi
            # OpenCode reads the prompt as positional args, so we
            # read the file and pass it on the command line. We
            # capture all output to a log file and expect a JSON-
            # shaped result at ${RESULT_FILE} written by the agent
            # itself (via AGENTS.md instructions). The `-i` flag
            # would force an interactive TUI which we don't want, so
            # we rely on the default (non-interactive) and pipe stdin
            # so the prompt is supplied as an argument, not requested
            # from the user.
            set +e
            "${cli}" run \
              "$(cat "${PROMPT_FILE}")" \
              ${EXTRA_ARGS} \
              > "${RESULT_FILE}.log" 2>&1
            rc=$?
            set -e
            # OpenCode doesn't currently honor AGENTS.md's "write a JSON
            # result file" contract; it just prints to the TUI / log and
            # creates a PR via `gh`. We salvage the run by scraping the
            # PR URL out of the log and synthesizing the JSON contract
            # that the rest of this action expects. Only treat the run
            # as a failure if we couldn't find a PR URL.
            #
            # When the agent actually committed (the common case), we
            # additionally pull a real summary and a real file list
            # from git instead of inventing placeholders. The agent
            # branch was forked from origin/${BASE_REF} by
            # checkout-and-prepare, so `git diff origin/${BASE_REF}...
            # HEAD` enumerates exactly the files the agent touched.
            # The latest commit body becomes the Kanban summary —
            # AGENTS.md mandates Conventional Commits referencing the
            # issue, so the subject is a meaningful one-liner.
            pr_url="$(grep -oE 'https://github\.com/[^[:space:]]+/pull/[0-9]+' "${RESULT_FILE}.log" | head -n1 || true)"
            if [[ -n "${pr_url}" ]]; then
              echo "::notice::opencode did not write ${RESULT_FILE}; recovered pr_url=${pr_url} from log (rc=${rc})"

              base_ref="${BASE_REF:-main}"

              # Files the agent changed. `git diff` operates on the
              # two commits directly, so it works under the shallow
              # clone that checkout-and-prepare sets up
              # (fetch-depth: 1 means there is no full history to
              # walk). An empty result means the agent didn't commit
              # anything (or the base ref is wrong) — we don't
              # fabricate a summary from base history in that case.
              set +e
              base_files="$(git diff --name-only "origin/${base_ref}...HEAD" 2>/dev/null | sort -u)"
              set -e

              if [[ -n "${base_files}" ]]; then
                # Newline list -> JSON array of non-empty strings.
                files_changed_json="$(printf '%s\n' "${base_files}" \
                  | jq -R . | jq -s 'map(select(length > 0))')"

                # Latest commit body, trimmed and clamped to keep
                # the Kanban comment readable. AGENTS.md mandates
                # Conventional Commits referencing the issue, so
                # the subject is a meaningful one-liner.
                commit_body="$(git log -1 --pretty=%B HEAD 2>/dev/null \
                  | sed -e '/^[[:space:]]*$/d' \
                  | head -c 500 || true)"
                if [[ -n "${commit_body// }" ]]; then
                  summary="${commit_body}"
                else
                  summary="opencode run recovered from log (rc=${rc})"
                fi
              else
                files_changed_json="[]"
                summary="opencode run recovered from log — no diff vs ${base_ref} (rc=${rc})"
              fi

              jq -n \
                --arg pr_url "${pr_url}" \
                --arg summary "${summary}" \
                --argjson files_changed "${files_changed_json}" \
                '{pr_url: $pr_url, summary: $summary, files_changed: $files_changed}' \
                > "${RESULT_FILE}"
            else
              # The agent ran but never opened (or printed) a PR URL.
              # Don't `exit 1` here — fall through to the safety net
              # below, which can still recover by committing any
              # uncommitted changes and opening a PR on the agent's
              # behalf. The safety net will exit 1 itself if it can't
              # recover (e.g. the agent did nothing at all).
              echo "::notice::opencode exited with ${rc} and no PR URL was found in the log; will attempt safety-net recovery" >&2
            fi
            ;;
          mavis|*)
            # Mavis / MiniMax Code: thin wrapper. The npm package is
            # `mmx-cli` and the binary is `mmx`. We resolve the binary
            # name explicitly so callers can pass `agent: mavis` without
            # needing to also override `agent_cli`. The Install Mavis CLI
            # step above installs into ${RUNNER_TEMP}/mavis-cli, so the
            # binary lives at that path (PATH overrides in env: don't
            # reliably propagate to bash scripts in some runner configs).
            if [[ -n "${AGENT_CLI:-}" ]]; then
              cli="${AGENT_CLI}"
            elif [[ -x "${RUNNER_TEMP}/mavis-cli/node_modules/.bin/mmx" ]]; then
              cli="${RUNNER_TEMP}/mavis-cli/node_modules/.bin/mmx"
            else
              cli="mmx"
            fi
            set +e
            "${cli}" run \
              --non-interactive \
              --prompt-file "${PROMPT_FILE}" \
              --result-file "${RESULT_FILE}" \
              ${EXTRA_ARGS} \
              > "${RESULT_FILE}.log" 2>&1
            rc=$?
            set -e
            if [[ $rc -ne 0 ]]; then
              echo "::error::mmx (mavis) exited with ${rc}. Log:" >&2
              cat "${RESULT_FILE}.log" >&2
              exit $rc
            fi
            ;;
        esac

        # Validate JSON
        if ! jq -e . "${RESULT_FILE}" >/dev/null 2>&1; then
          # The agent didn't write a JSON result file. This is the
          # common case for opencode, claude, etc. — they just print
          # to the log instead of writing a structured file. Fall
          # through to the safety net below, which can still recover
          # a PR URL from the log or from a fresh commit+push.
          echo "::notice::agent did not write ${RESULT_FILE}; will try safety net" >&2
          # Create a placeholder JSON with empty pr_url so the safety
          # net can update it. The safety net also overwrites this
          # file when it manages to open a PR.
          printf '%s' '{"pr_url":"","summary":"","files_changed":[]}' > "${RESULT_FILE}"
        fi

        pr_url="$(jq -r '.pr_url // ""' "${RESULT_FILE}")"

        # Safety net: if the agent ran (exited 0) but didn't open a
        # PR — either because the model decided not to commit or
        # because the PR URL just didn't make it into the log — try
        # to recover by committing any uncommitted changes the agent
        # left behind and opening a PR ourselves. Without this, the
        # run reports success and the card stays in "In Progress"
        # forever, which is the failure mode reported in
        # https://github.com/LucasBFerraz/agente-teste-pcrl/actions/runs/32426383084
        # and a half-dozen earlier runs.
        #
        # We only run the safety net when the agent itself didn't
        # open a PR (pr_url is empty) AND the workspace has changes
        # that the agent left for us. If the agent already pushed
        # and opened a PR (the common case), pr_url is non-empty
        # and we skip this entire block.
        if [[ -z "${pr_url}" ]]; then
          # Are there uncommitted changes?
          uncommitted="$(git status --porcelain 2>/dev/null || true)"
          # Are there any commits ahead of the base ref?
          set +e
          ahead_count="$(git rev-list --count "origin/${BASE_REF:-main}..HEAD" 2>/dev/null || echo 0)"
          set -e
          if [[ -n "${uncommitted}" || "${ahead_count}" -eq 0 ]]; then
            echo "::notice::Safety net: agent did not open a PR. uncommitted='${uncommitted}' ahead=${ahead_count}. Recovering by committing and opening a PR." >&2

            # Figure out a Conventional Commits subject. Pull the
            # issue number from the prompt file (it always starts
            # with "# Issue #N — title").
            prompt_text="$(cat "${PROMPT_FILE}" 2>/dev/null || true)"
            issue_n="$(printf '%s' "${prompt_text}" | grep -oE '^# Issue #[0-9]+' | head -n1 | grep -oE '[0-9]+' || true)"
            issue_title="$(printf '%s' "${prompt_text}" | head -n1 | sed -E 's/^# Issue #[0-9]+ — ?//')"
            slug="$(printf '%s' "${issue_title}" \
              | tr '[:upper:]' '[:lower:]' \
              | sed -E 's/[^a-z0-9]+/-/g' \
              | sed -E 's/^-+|-+$//g' \
              | cut -c1-50)"
            [[ -z "${slug}" ]] && slug="agent-changes"
            if [[ -n "${issue_n}" ]]; then
              commit_subject="chore(${slug}): recover agent changes (#${issue_n})"
              commit_body="The agent for issue #${issue_n} did not commit its changes. This commit was made by the agent-runner safety net so the workflow has a deliverable."
            else
              commit_subject="chore(${slug}): recover agent changes"
              commit_body="The agent did not commit its changes. This commit was made by the agent-runner safety net so the workflow has a deliverable."
            fi

            # Set up git identity and auth. We push via the agent's
            # token, which has contents:write on the consumer repo.
            git config user.name "agent-runner-safety-net"
            git config user.email "agent-runner-safety-net@users.noreply.github.com"
            if [[ -n "${AGENT_TOKEN:-${GH_TOKEN:-}}" ]]; then
              auth_token="${AGENT_TOKEN:-${GH_TOKEN:-}}"
              git remote set-url origin "https://x-access-token:${auth_token}@github.com/${GH_REPO}.git"
            fi

            # Only commit if there are uncommitted changes. If the
            # agent already committed (ahead_count > 0) but didn't
            # push, just push — don't make a duplicate empty commit.
            if [[ -n "${uncommitted}" ]]; then
              git add -A
              git commit -m "${commit_subject}" -m "${commit_body}" || true
            fi
            # Re-check ahead count after the commit. The earlier
            # `ahead_count` was computed before the safety net's own
            # commit, so it could be stale.
            set +e
            ahead_count="$(git rev-list --count "origin/${BASE_REF:-main}..HEAD" 2>/dev/null || echo 0)"
            set -e
            if [[ "${ahead_count}" -eq 0 ]]; then
              # Even after committing, we may not be ahead if the
              # commit was a no-op. In that case, just give up —
              # there's nothing to push.
              echo "::warning::Safety net: nothing to push (no commits ahead of origin/${BASE_REF:-main}). Treating as failure." >&2
            else
              branch="$(git rev-parse --abbrev-ref HEAD)"
              git push origin "HEAD:${branch}" || {
                echo "::error::Safety net: git push failed. The agent neither committed nor pushed; the run cannot produce a PR." >&2
                exit 1
              }

              # Open the PR with `gh` (already authenticated via GH_TOKEN).
              pr_body="$(printf '%s\n\n%s' "${commit_body}" "Recovered by the agent-runner safety net because the model did not commit/push on its own.")"
              pr_url="$(gh pr create --base "${BASE_REF:-main}" --head "${branch}" --title "${commit_subject}" --body "${pr_body}" 2>&1 | tail -n1 || true)"
              if [[ -z "${pr_url}" || "${pr_url}" != *"/pull/"* ]]; then
                echo "::error::Safety net: gh pr create did not return a PR URL. Output: ${pr_url}" >&2
                exit 1
              fi
              echo "::notice::Safety net opened PR: ${pr_url}" >&2

              # Files changed = the new diff vs base.
              files_changed_json="$(git diff --name-only "origin/${BASE_REF:-main}...HEAD" 2>/dev/null \
                | sort -u | jq -R . | jq -s 'map(select(length > 0))')"
              summary="${commit_subject}"
              jq -n \
                --arg pr_url "${pr_url}" \
                --arg summary "${summary}" \
                --argjson files_changed "${files_changed_json}" \
                '{pr_url: $pr_url, summary: $summary, files_changed: $files_changed}' \
                > "${RESULT_FILE}"
            fi
          else
            # Agent already committed and pushed (ahead_count > 0)
            # but no PR URL was found in the log. The agent must
            # have used `gh pr create` and the URL just didn't match
            # the grep pattern. Try to find the existing PR by
            # querying GitHub for the branch.
            branch="$(git rev-parse --abbrev-ref HEAD)"
            if [[ -n "${GH_TOKEN:-}" ]]; then
              recovered="$(gh pr list --head "${branch}" --base "${BASE_REF:-main}" --state all --json url -q '.[0].url' 2>/dev/null || true)"
              if [[ -n "${recovered}" && "${recovered}" == *"/pull/"* ]]; then
                echo "::notice::Safety net: found existing PR via gh pr list: ${recovered}" >&2
                pr_url="${recovered}"
                files_changed_json="$(git diff --name-only "origin/${BASE_REF:-main}...HEAD" 2>/dev/null \
                  | sort -u | jq -R . | jq -s 'map(select(length > 0))')"
                commit_body="$(git log -1 --pretty=%B HEAD 2>/dev/null | sed -e '/^[[:space:]]*$/d' | head -c 500 || true)"
                [[ -z "${commit_body}" ]] && commit_body="Agent already opened this PR; safety net only recovered the URL."
                jq -n \
                  --arg pr_url "${pr_url}" \
                  --arg summary "${commit_body}" \
                  --argjson files_changed "${files_changed_json}" \
                  '{pr_url: $pr_url, summary: $summary, files_changed: $files_changed}' \
                  > "${RESULT_FILE}"
              fi
            fi
          fi
        fi

        pr_url="$(jq -r '.pr_url // ""' "${RESULT_FILE}")"
        summary="$(jq -r '.summary // ""' "${RESULT_FILE}")"
        files_changed="$(jq -r '.files_changed // [] | join(",")' "${RESULT_FILE}")"

        echo "pr_url=${pr_url}" >> "${GITHUB_OUTPUT}"
        echo "summary=${summary}" >> "${GITHUB_OUTPUT}"
        echo "files_changed=${files_changed}" >> "${GITHUB_OUTPUT}"

        # Embed raw JSON as a multiline output
        raw="$(cat "${RESULT_FILE}")"
        echo "result_json<<EOF" >> "${GITHUB_OUTPUT}"
        echo "${raw}" >> "${GITHUB_OUTPUT}"
        echo "EOF" >> "${GITHUB_OUTPUT}"

        # Upload log as an artifact for debugging
        mkdir -p "${workdir}/.agent-artifacts"
        cp "${RESULT_FILE}.log" "${workdir}/.agent-artifacts/" || true
        cp "${RESULT_FILE}" "${workdir}/.agent-artifacts/" || true

    - name: Upload agent artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: agent-runner-${{ inputs.agent }}-${{ github.run_id }}
        path: |
          ${{ steps.prep.outputs.result_file }}
          ${{ steps.prep.outputs.result_file }}.log
          .agent-prompt.md
        if-no-files-found: warn
